<!DOCTYPE html>
<html>

<head>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <style>
    body {
      background: #111;
      color: white;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      font-family: sans-serif;
    }

    .item {
      width: 180px;
      text-align: center;
      border: 1px solid #333;
      padding: 10px;
      border-radius: 10px;
    }

    .box {
      width: 150px;
      height: 150px;
      margin: 0 auto;
      background: #222;
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <script>
    const files = [
      'bunny_bear.json', 'joker_bear.json', 'pink_bear.json', 'plumber_bear.json',
      'football_bear.json', 'santa_bear.json', 'gnome_bear.json', 'hear.json',
      'green_tree.json', 'hug_bear.json'
    ];

    files.forEach(f => {
      const item = document.createElement('div');
      item.className = 'item';
      item.innerHTML = `<div>${f}</div><div id="b-${f.replace('.json', '')}" class="box"></div>`;
      document.body.appendChild(item);

      fetch('assets/' + f)
        .then(r => r.json())
        .then(data => {
          lottie.loadAnimation({
            container: document.getElementById('b-' + f.replace('.json', '')),
            renderer: 'canvas',
            loop: true,
            autoplay: true,
            animationData: data
          });
        });
    });
  </script>
</body>

</html>
